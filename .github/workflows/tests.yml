name: tests

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests experiments -q

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show runner toolchain
        run: rustc --version && cargo --version
      - name: Test statistics and CLI
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Test macOS sandbox runner
        if: runner.os == 'macOS'
        run: cargo test --locked --manifest-path artifacts/sandbox_benchmark/rust_runner/Cargo.toml

  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/computer-browser
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/computer-browser/package-lock.json
      - name: Install locked browser dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check generated runtime artifacts
        run: npm run check:runtime
      - name: Typecheck runtime sources and consumers
        run: npm run typecheck
      # Every test file runs except those listed with a reason in test/ci-excluded.json
      # (they start the real Electron app, which this install does not download).
      - name: Run the browser test suite
        run: node tools/ci-tests.js

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck and build
        run: npm run build
