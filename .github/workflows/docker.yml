name: Docker development gateway

on:
  pull_request:
    paths: ["halo/**", "tools/docker_smoke.py", "tools/init_docker_secrets.py", "Dockerfile", ".dockerignore", "compose.yaml", ".github/workflows/docker.yml"]
  push:
    branches: [main, develop]
    paths: ["halo/**", "tools/docker_smoke.py", "tools/init_docker_secrets.py", "Dockerfile", ".dockerignore", "compose.yaml", ".github/workflows/docker.yml"]

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable development keys
        run: python3 tools/init_docker_secrets.py
      - name: Build and start gateway
        run: docker compose up --build --wait --wait-timeout 60
      - name: Check permissions and authenticated execution
        run: |
          docker compose exec -T gateway python -c 'import os; assert os.getuid() == 10001'
          docker compose exec -T gateway python tools/docker_smoke.py
      - name: Check restart with persistent state and keys
        run: |
          docker compose restart gateway
          docker compose up --wait --wait-timeout 60
          docker compose exec -T gateway python tools/docker_smoke.py
      - name: Stop gateway
        if: always()
        run: docker compose down
